name: Update gitignore file

on:
  schedule:
    # daily at 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: gitignore-in/gh-action@497638056b4abf3bc97f007e091b451633904f2f # v0.2.4
